services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - ch-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: vera
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: vera
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  model-mock:
    build: ../../tools/simulator
    command: python mock_model.py
    environment:
      MOCK_PORT: "9000"

  gateway:
    build: ../../services/gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_UPSTREAM: http://model-mock:9000
      CLICKHOUSE_ADDR: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: vera
      CLICKHOUSE_DB: vera
      MODEL_NAME: ctr
      MODEL_VERSION: v1
      CONTAINER_ID: gateway-local
    depends_on:
      - clickhouse
      - model-mock

  loadgen:
    build: ../../tools/simulator
    command: python send_events.py --target http://gateway:8080/v1/predict --rate 20 --duration 30
    depends_on:
      - gateway

volumes:
  ch-data:
