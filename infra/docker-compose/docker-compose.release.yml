# Vera 零代码私有化部署版：纯镜像拉取，不构建源码，不含任何模拟/测试服务。
# 用法: docker compose -f docker-compose.release.yml up -d
# 版本钉定: export VERA_IMAGE_TAG=<version>（默认 latest，install.sh 传参）
# 接入真实模型: 设置 GATEWAY_UPSTREAM（默认指向宿主机 9000 端口）
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - ch-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: vera
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: vera
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  gateway:
    image: ghcr.io/sufengx/vera/gateway:${VERA_IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-http://host.docker.internal:9000}
      CLICKHOUSE_ADDR: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: vera
      CLICKHOUSE_DB: vera
      MODEL_NAME: ctr
      MODEL_VERSION: v1
      CONTAINER_ID: gateway-local
    depends_on:
      - clickhouse

  detector:
    image: ghcr.io/sufengx/vera/detector:${VERA_IMAGE_TAG:-latest}
    environment:
      CLICKHOUSE_ADDR: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: vera
      CLICKHOUSE_DB: vera
      DETECTOR_CURRENT_MINUTES: ${DETECTOR_CURRENT_MINUTES:-5}
      DETECTOR_BASELINE_OFFSET: ${DETECTOR_BASELINE_OFFSET:-30}
      DETECTOR_BASELINE_MINUTES: ${DETECTOR_BASELINE_MINUTES:-30}
      DETECTOR_SCAN_INTERVAL: ${DETECTOR_SCAN_INTERVAL:-60}
      DETECTOR_KS_THRESHOLD: ${DETECTOR_KS_THRESHOLD:-0.05}
      DETECTOR_PSI_THRESHOLD: ${DETECTOR_PSI_THRESHOLD:-0.1}
      DETECTOR_MIN_EVENTS: ${DETECTOR_MIN_EVENTS:-50}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-15}
    depends_on:
      - clickhouse

  dashboard:
    image: ghcr.io/sufengx/vera/dashboard:${VERA_IMAGE_TAG:-latest}
    ports:
      - "8501:8501"
    environment:
      CLICKHOUSE_ADDR: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: vera
      CLICKHOUSE_DB: vera
      DETECTOR_CURRENT_MINUTES: ${DETECTOR_CURRENT_MINUTES:-5}
      DETECTOR_BASELINE_OFFSET: ${DETECTOR_BASELINE_OFFSET:-30}
      DETECTOR_BASELINE_MINUTES: ${DETECTOR_BASELINE_MINUTES:-30}
    depends_on:
      - clickhouse

volumes:
  ch-data:
