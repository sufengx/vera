server {
    listen 8501;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端数据接口：代理到 ClickHouse，注入 Basic 认证（凭据不进浏览器）
    location /api/ {
        proxy_pass http://clickhouse:8123/;
        proxy_set_header Authorization "Basic ZGVmYXVsdDp2ZXJh";
    }

    # 根因分析接口：代理到 rootcause 服务
    location /rc/ {
        proxy_pass http://rootcause:8000/;
    }

    location / {
        try_files $uri /index.html;
    }
}
