name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-gateway:
    name: Lint Go Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...

  test-gateway:
    name: Unit Tests — Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./...

  lint-python:
    name: Lint Python Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/simulator/mock_model.py tools/simulator/send_events.py services/detector/*.py services/rootcause/*.py

  test-detector:
    name: Unit Tests — Detector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests -q

  test-rootcause:
    name: Unit Tests — Root Cause
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rootcause
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests -q

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vera/gateway:ci services/gateway
      - run: docker build -t vera/detector:ci services/detector
      - run: docker build -t vera/rootcause:ci services/rootcause
      - run: docker build -t vera/dashboard:ci services/dashboard

  integration:
    name: Integration Tests (docker-compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 启动全栈（含全新环境初始化）
        env:
          DETECTOR_CURRENT_MINUTES: "1"
          DETECTOR_BASELINE_OFFSET: "1"
          DETECTOR_BASELINE_MINUTES: "1"
          DETECTOR_SCAN_INTERVAL: "20"
          DETECTOR_MIN_EVENTS: "5"
        run: docker compose -f infra/docker-compose/docker-compose.yml up -d --build
      - name: 等 loadgen 打完流量并落库（30s 压测 + 批量刷新余量）
        run: sleep 40
      - name: 断言事件已写入 ClickHouse
        run: |
          COUNT=$(curl -s -u default:vera "http://localhost:8123/?query=SELECT+count(*)+FROM+vera.events+FORMAT+CSV")
          echo "events=$COUNT"
          [ "$COUNT" -gt 0 ] || { echo "集成测试失败：无事件落库"; exit 1; }
      - name: 等检测器完成至少一轮扫描
        run: sleep 30
      - name: 断言漂移结果已写入
        run: |
          COUNT=$(curl -s -u default:vera "http://localhost:8123/?query=SELECT+count(*)+FROM+vera.drift_results+FORMAT+CSV")
          echo "drift_results=$COUNT"
          [ "$COUNT" -gt 0 ] || { echo "集成测试失败：无漂移结果"; exit 1; }
      - name: 注入已知漂移的合成事件（固定时间窗口，确定性断言）
        run: |
          python - <<'EOF'
          import json
          import urllib.request
          import uuid

          def rows(conf, lat, n, t, client):
              return [{
                  "event_id": str(uuid.uuid4()), "timestamp": t,
                  "request_id": str(uuid.uuid4()), "model_name": "ci-probe",
                  "model_version": "v1", "route": "/v1/predict", "client_id": client,
                  "input_summary_hash": "x", "prediction": "0.5", "confidence": conf,
                  "latency_ms": lat, "server_hostname": "ci", "container_id": "ci",
                  "sampling_flag": True, "privacy_mask_level": "full",
              } for _ in range(n)]

          # 基准窗口 confidence≈0.6；当前窗口 confidence≈0.9（漂移），
          # latency 仅在 ci-b 子群翻 4 倍（子群漂移）
          base = rows(0.6, 10.0, 60, "2026-01-02 03:00:00", "ci-a")
          cur = rows(0.9, 10.0, 60, "2026-01-02 03:12:00", "ci-a") + \
                rows(0.9, 40.0, 60, "2026-01-02 03:12:00", "ci-b")
          body = ("\n".join(json.dumps(r) for r in base + cur) + "\n").encode()  # JSONEachRow 按行分隔
          req = urllib.request.Request(
              "http://localhost:8123/?query=INSERT+INTO+vera.events+FORMAT+JSONEachRow",
              data=body, method="POST",
              headers={"Authorization": "Basic ZGVmYXVsdDp2ZXJh"},
          )
          urllib.request.urlopen(req)
          print("inserted", len(base) + len(cur))
          EOF
      - name: 断言根因定位 top 特征为 confidence、子群为 ci-b
        run: |
          REPORT=$(curl -s "http://localhost:8100/api/v1/rootcause?current_from=2026-01-02%2003:10:00&current_to=2026-01-02%2003:20:00&model=ci-probe")
          echo "$REPORT" | python -c "
          import json
          import sys
          r = json.load(sys.stdin)
          assert r['status'] == 'ok', r
          feats = [f['name'] for f in r['features']]
          assert feats and feats[0] == 'confidence', feats
          segs = [s['value'] for s in r['segments']]
          assert 'ci-b' in segs[:3], segs
          print('root cause verified:', feats, segs)
          "
      - name: 清理环境
        if: always()
        run: docker compose -f infra/docker-compose/docker-compose.yml down -v

  publish-images:
    name: Build & Push to GHCR
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [lint-gateway, test-gateway, lint-python, test-detector, test-rootcause]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: gateway
            context: services/gateway
          - image: detector
            context: services/detector
          - image: rootcause
            context: services/rootcause
          - image: dashboard
            context: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
