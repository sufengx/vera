name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-gateway:
    name: Lint Go Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...

  test-gateway:
    name: Unit Tests — Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./...

  lint-python:
    name: Lint Python Services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile mock_model.py send_events.py

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vera/gateway:ci services/gateway

  integration:
    name: Integration Tests (docker-compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 启动全栈（含全新环境初始化）
        run: docker compose -f infra/docker-compose/docker-compose.yml up -d --build
      - name: 等 loadgen 打完流量并落库（30s 压测 + 批量刷新余量）
        run: sleep 40
      - name: 断言事件已写入 ClickHouse
        run: |
          COUNT=$(curl -s -u default:vera "http://localhost:8123/?query=SELECT+count(*)+FROM+vera.events+FORMAT+CSV")
          echo "events=$COUNT"
          [ "$COUNT" -gt 0 ] || { echo "集成测试失败：无事件落库"; exit 1; }
      - name: 清理环境
        if: always()
        run: docker compose -f infra/docker-compose/docker-compose.yml down -v
